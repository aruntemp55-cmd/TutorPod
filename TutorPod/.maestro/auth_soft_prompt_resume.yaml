# v3: login-first. Guest soft-prompt resume is retired; this proves Start podcast after Login.
# Run: maestro test .maestro/auth_soft_prompt_resume.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-resume@example.com"
- tapOn: "Chemistry"
- tapOn: "Play Some Basic Concepts of Chemistry"
- extendedWaitUntil:
    visible: "Audio Overview"
    timeout: 15000
- assertVisible: "Start podcast"
