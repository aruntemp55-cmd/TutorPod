# Sprint 4 T041 — Login-first: OTP → Settings if needed → Main → subject → Player → Raise hand
# Run: maestro test .maestro/sprint4_raise_hand.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-raise@example.com"
- tapOn: "Chemistry"
- extendedWaitUntil:
    visible:
      id: "screen-topics"
    timeout: 15000
- tapOn: "Play Some Basic Concepts of Chemistry"
- extendedWaitUntil:
    visible: "Audio Overview"
    timeout: 15000
- tapOn: "Start podcast"
- extendedWaitUntil:
    visible: "Raise hand"
    timeout: 60000
- tapOn: "Raise hand"
- extendedWaitUntil:
    visible: "Ask your tutor"
    timeout: 10000
- tapOn:
    id: "ask-text-input"
- inputText: "What is the key idea here?"
- tapOn:
    id: "ask-send"
- extendedWaitUntil:
    visible: ".*Focus on|Great question|Answer|try again.*"
    timeout: 20000
- tapOn: "Resume listening"
- tapOn: "←"
    optional: true
- tapOn:
    id: "button-back-main"
    optional: true
