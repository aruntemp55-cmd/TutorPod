# Sprint 2 T023 — Main tiles (v3; no Home/MyPods/Account tabs)
# Run: maestro test .maestro/catalog_tabs.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-tiles@example.com"
- tapOn:
    id: "tile-ask"
- extendedWaitUntil:
    visible:
      id: "screen-ask"
    timeout: 10000
- tapOn: "← Back"
- tapOn:
    id: "tile-mypods"
- extendedWaitUntil:
    visible: "My Pods"
    timeout: 10000
- tapOn: "← Back"
