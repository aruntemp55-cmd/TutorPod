# Sprint 2 T023 — Bottom tabs Home / MyPods / Account
# Run: maestro test .maestro/catalog_tabs.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Tutor Pod"
    timeout: 45000
- runFlow:
    when:
      visible: "Next"
    commands:
      - tapOn: "Next"
      - tapOn: "Next"
      - tapOn: "Get started"
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 15000
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Start podcast"
    timeout: 15000
- tapOn: "MyPods"
- extendedWaitUntil:
    visible: ".*Sign in|MyPods|No pods.*"
    timeout: 15000
