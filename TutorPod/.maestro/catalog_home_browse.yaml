# Sprint 2 — Login-first Main catalog (subjects + start path), not guest Home pills
# Run: maestro test .maestro/catalog_home_browse.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-browse@example.com"
- assertVisible: "Ask any question"
- assertVisible: "My Pods"
- assertVisible: "Learning Path"
- assertVisible: "Chemistry"
- tapOn: "Chemistry"
- extendedWaitUntil:
    visible: "Topics"
    timeout: 15000
- tapOn: "Play Some Basic Concepts of Chemistry"
- assertVisible: "Start podcast"
