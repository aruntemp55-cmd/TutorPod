# Sprint 3 T031–T034 — Login-first Start podcast → Generating/Player
# Run: maestro test .maestro/pods_start_player.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-pods@example.com"
- tapOn: "Chemistry"
- tapOn: "Play Some Basic Concepts of Chemistry"
- extendedWaitUntil:
    visible: "Audio Overview"
    timeout: 15000
- tapOn: "Start podcast"
- extendedWaitUntil:
    visible: ".*Generating|Player|↺10|Raise hand.*"
    timeout: 45000
