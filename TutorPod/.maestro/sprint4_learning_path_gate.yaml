# T043 — Login-first Learning Path from Main (guest LP gate retired)
# Run: maestro test .maestro/sprint4_learning_path_gate.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-lp@example.com"
- tapOn:
    id: "tile-learning"
- extendedWaitUntil:
    visible:
      id: "screen-learning-path"
    timeout: 15000
- assertVisible: "Learning Path"
- tapOn: "Foundations Path"
    optional: true
- tapOn:
    text: ".*Path.*"
    optional: true
- assertNotVisible: "Sign in to choose a learning path"
