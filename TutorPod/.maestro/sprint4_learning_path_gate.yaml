# Sprint 4 T043/T046 — Guest Learning Path soft-prompt gate
# Run: maestro test .maestro/sprint4_learning_path_gate.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Tutor Pod"
    timeout: 45000
- runFlow:
    when:
      visible: "Next"
    commands:
      - tapOn: "Next"
      - tapOn: "Next"
      - tapOn: "Get started"
- tapOn: "Learning Path"
- extendedWaitUntil:
    visible: "Sign in to choose a learning path"
    timeout: 15000
- tapOn: "Not now"
- assertVisible: "All"
