# Sprint 2 T024 — Guest Play/Start never opens Player; soft-prompt only
# Run: maestro test .maestro/catalog_soft_prompt_gate.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Tutor Pod"
    timeout: 45000
- runFlow:
    when:
      visible: "Next"
    commands:
      - tapOn: "Next"
      - tapOn: "Next"
      - tapOn: "Get started"
- extendedWaitUntil:
    visible: "Start podcast"
    timeout: 30000
- tapOn: "Start podcast"
- extendedWaitUntil:
    visible: "Sign in to listen"
    timeout: 15000
- tapOn: "Not now"
- assertNotVisible: "Audio Overview"
- tapOn: "Learning Path"
- extendedWaitUntil:
    visible: "Sign in to choose a learning path"
    timeout: 15000
- tapOn: "Not now"
- assertVisible: "All"
