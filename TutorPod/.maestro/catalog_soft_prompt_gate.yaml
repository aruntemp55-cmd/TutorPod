# v3: login is required; there is no guest Start/Learning Path soft-prompt.
# Run: maestro test .maestro/catalog_soft_prompt_gate.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "screen-login"
    timeout: 45000
- assertVisible: "Sign in to continue"
- assertNotVisible: "Start podcast"
- assertNotVisible: "All"
