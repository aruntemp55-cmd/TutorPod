# Sprint 3 T033 — Login-first My Pods tile
# Run: maestro test .maestro/pods_mypods.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-mypods@example.com"
- tapOn:
    id: "tile-mypods"
- extendedWaitUntil:
    visible: ".*My Pods|No pods.*"
    timeout: 15000
