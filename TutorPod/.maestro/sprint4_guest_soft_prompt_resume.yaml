# v3: guest start-podcast resume retired; Login-first Start podcast
# Run: maestro test .maestro/sprint4_guest_soft_prompt_resume.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-s4-resume@example.com"
- tapOn: "Chemistry"
- tapOn: "Play Some Basic Concepts of Chemistry"
- extendedWaitUntil:
    visible: "Audio Overview"
    timeout: 25000
- assertVisible: "Start podcast"
