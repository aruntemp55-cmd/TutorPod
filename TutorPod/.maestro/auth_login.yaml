# Sprint 1 T011 — Login-first OTP → Main (+ Settings logout → Login)
# Run: maestro test .maestro/auth_login.yaml
appId: com.seyon.tutorpod
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/login_to_main.yaml
    env:
      STUDENT_EMAIL: "maestro-student@example.com"
- tapOn:
    id: "screen-main"
- tapOn:
    accessibilityLabel: "Settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "button-logout"
- extendedWaitUntil:
    visible:
      id: "screen-login"
    timeout: 15000
