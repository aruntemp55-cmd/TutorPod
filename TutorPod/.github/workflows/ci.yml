name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    name: Sprint 5 quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutorpod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tutorpod
      JWT_SECRET: ci-test-secret
      OTP_STUB_CODE: "000000"
      POD_GENERATE_DELAY_MS: "0"
      PUBLIC_BASE_URL: http://localhost:4010
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate + seed
        run: |
          npm run api:migrate
          npm run api:seed

      - name: Headless quality gate
        run: npm run ci

      - name: Maestro note
        run: |
          echo "Maestro E2E is documented under Plan/docs/sprint5-quality-gate.md"
          echo "Critical journey: .maestro/critical_journey.yaml (run locally / device CI)"
          ls .maestro/*.yaml
